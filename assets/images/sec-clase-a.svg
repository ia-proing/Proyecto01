<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="sec-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35C6BC" />
      <stop offset="100%" stop-color="#0E8A85" />
    </linearGradient>
    <filter id="badge-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Escudo / Insignia Circular -->
  <circle cx="60" cy="60" r="54" fill="#16243A" stroke="#1E293B" stroke-width="2" filter="url(#badge-shadow)" />
  <circle cx="60" cy="60" r="48" fill="none" stroke="url(#sec-gold)" stroke-width="1.8" stroke-dasharray="3 2" />

  <!-- Símbolo de Alta Tensión / Energía Eléctrica -->
  <path d="M 62,24 L 46,54 L 58,54 L 54,82 L 74,50 L 62,50 Z" fill="url(#sec-gold)" opacity="0.25" />

  <!-- Texto SEC -->
  <text x="60" y="44" text-anchor="middle" font-family="'Manrope', sans-serif" font-weight="800" font-size="14" fill="#35C6BC" letter-spacing="2">SEC</text>

  <!-- Letra Clase A -->
  <text x="60" y="70" text-anchor="middle" font-family="'Manrope', sans-serif" font-weight="900" font-size="24" fill="#F5F7FB" letter-spacing="1">CLASE A</text>

  <!-- Subtítulo Chile -->
  <text x="60" y="86" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="7.5" fill="#94A3B8" letter-spacing="1.5">ALTA Y BAJA TENSIÓN</text>
  <text x="60" y="96" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="500" font-size="6.5" fill="#64748B" letter-spacing="1">CHILE</text>
</svg>

