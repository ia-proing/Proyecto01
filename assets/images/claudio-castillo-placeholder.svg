<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" width="100%" height="100%">
  <defs>
    <linearGradient id="avatar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16243A" />
      <stop offset="100%" stop-color="#0B1220" />
    </linearGradient>
    <linearGradient id="avatar-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35C6BC" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#16243A" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="accent-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35C6BC" />
      <stop offset="100%" stop-color="#1E3A5F" />
    </linearGradient>
    <pattern id="grid-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Fondo base -->
  <rect width="400" height="460" rx="24" fill="url(#avatar-bg)" />
  <rect width="400" height="460" rx="24" fill="url(#grid-pattern)" />
  <circle cx="200" cy="180" r="140" fill="url(#avatar-glow)" />

  <!-- Borde exterior sutil -->
  <rect x="2" y="2" width="396" height="456" rx="22" fill="none" stroke="url(#accent-stroke)" stroke-width="1.5" />

  <!-- Silueta ejecutiva estilizada -->
  <g fill="#1F314D" opacity="0.85">
    <!-- Cabeza -->
    <circle cx="200" cy="170" r="56" />
    <!-- Cuello y hombros -->
    <path d="M 120 330 C 120 250, 160 230, 200 230 C 240 230, 280 250, 280 330 Z" />
    <!-- Traje / Cuello chaqueta -->
    <path d="M 170 330 L 200 260 L 230 330 Z" fill="#0B1220" />
  </g>

  <!-- Monograma central CCO -->
  <circle cx="200" cy="170" r="42" fill="#16243A" stroke="#35C6BC" stroke-width="2" />
  <text x="200" y="178" text-anchor="middle" font-family="'Manrope', sans-serif" font-weight="800" font-size="22" fill="#F5F7FB" letter-spacing="2">CCO</text>

  <!-- Tag de Especialidad -->
  <g transform="translate(70, 370)">
    <rect width="260" height="48" rx="24" fill="#0E1726" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="28" cy="24" r="5" fill="#35C6BC" />
    <text x="44" y="22" font-family="'Manrope', sans-serif" font-weight="700" font-size="12" fill="#F5F7FB">Claudio Castillo O.</text>
    <text x="44" y="36" font-family="'Inter', sans-serif" font-weight="500" font-size="9.5" fill="#94A3B8">Ingeniería &amp; IA Aplicada</text>
  </g>
</svg>

